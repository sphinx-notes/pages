name: Test

on:
  pull_request:
  push:
    branches: [v3]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pypi_installer: [pip, uv]
        cache: [false, true]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required by sphinxnotes-incrbuild when cache is enabled
      - id: build
        name: Build documentation (pypi_installer=${{ matrix.pypi_installer }}, cache=${{ matrix.cache }})
        uses: ./
        with:
          pypi_installer: ${{ matrix.pypi_installer }}
          cache: ${{ matrix.cache }}
          checkout: false
          publish: false
      - name: Verify build output
        run: test -f "${{ steps.build.outputs.artifact }}/index.html"
